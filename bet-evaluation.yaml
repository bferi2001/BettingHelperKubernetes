apiVersion: apps/v1
kind: Deployment
metadata:
  name: bet-evaluation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bet-evaluation
  template:
    metadata:
      labels:
        app: bet-evaluation
    spec:
      hostAliases:
      - ip: "10.42.0.1"
        hostnames:
        - "host.docker.internal"
      containers:
      - name: bet-evaluation
        image: 192.168.100.18:5000/bet-evaluation:1.0.1
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bet-evaluation-service
spec:
  selector:
    app: bet-evaluation
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bet-evaluation
  labels:
    app.kubernetes.io/name: bet-evaluation
    storedemo.tier: backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-bet-evaluation-stripprefix@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api/bet-evaluation
            pathType: Prefix
            backend:
              service:
                name: bet-evaluation-service
                port:
                  number: 8002
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bet-evaluation-stripprefix
spec:
  stripPrefix:
    prefixes:
      - /api/bet-evaluation
