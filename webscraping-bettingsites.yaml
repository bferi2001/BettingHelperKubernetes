apiVersion: apps/v1
kind: Deployment
metadata:
  name: webscraping-bettingsites
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webscraping-bettingsites
  template:
    metadata:
      labels:
        app: webscraping-bettingsites
    spec:
      hostAliases:
      - ip: "10.42.0.1"
        hostnames:
        - "host.docker.internal"
      containers:
      - name: webscraping-bettingsites
        image: 192.168.100.18:5000/webscraping-bettingsites:1.1.1
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: webscraping-bettingsites-service
spec:
  selector:
    app: webscraping-bettingsites
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webscraping-bettingsites
  labels:
    app.kubernetes.io/name: webscraping-bettingsites
    storedemo.tier: backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-webscraping-bettingsites-stripprefix@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api/webscraping-bettingsites
            pathType: Prefix
            backend:
              service:
                name: webscraping-bettingsites-service
                port:
                  number: 8001
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: webscraping-bettingsites-stripprefix
spec:
  stripPrefix:
    prefixes:
      - /api/webscraping-bettingsites
