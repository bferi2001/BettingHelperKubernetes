apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendations
  template:
    metadata:
      labels:
        app: recommendations
    spec:
      containers:
      - name: recommendations
        image: 192.168.100.18:5000/recommendations:1.0.5
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: recommendations-service
spec:
  selector:
    app: recommendations
  ports:
    - port: 8005
      targetPort: 8005
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recommendations
  labels:
    app.kubernetes.io/name: recommendations
    storedemo.tier: backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-recommendations-stripprefix@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api/recommendations
            pathType: Prefix
            backend:
              service:
                name: recommendations-service
                port:
                  number: 8005
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: recommendations-stripprefix
spec:
  stripPrefix:
    prefixes:
      - /api/recommendations