apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
    spec:
      containers:
      - name: aggregator
        image: 192.168.100.18:5000/aggregator:1.0.0
        resources:
          requests:
            cpu: "125m"
            memory: "128Mi"
          limits:
            cpu: "375m"
            memory: "512Mi"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator-service
spec:
  selector:
    app: aggregator
  ports:
    - port: 8004
      targetPort: 8004
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aggregator
  labels:
    app.kubernetes.io/name: aggregator
    storedemo.tier: backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-aggregator-stripprefix@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api/aggregator
            pathType: Prefix
            backend:
              service:
                name: aggregator-service
                port:
                  number: 8004
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aggregator-stripprefix
spec:
  stripPrefix:
    prefixes:
      - /api/aggregator